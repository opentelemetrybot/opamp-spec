name: Question
description: Ask a question about the OpAMP specification
title: "[Question] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your interest in the OpAMP specification!
        
        Please provide as much detail as possible to help us understand your question.
  
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know about the OpAMP specification?
      placeholder: Ask your question here...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide any background context that might help us understand your question.
      placeholder: What are you trying to accomplish? What have you already tried?
    validations:
      required: false

  - type: textarea
    id: spec-section
    attributes:
      label: Specification Section
      description: Which section(s) of the OpAMP specification does your question relate to?
      placeholder: e.g., "Section 3.2.1 - Agent Configuration", "OpAMP Protocol Messages", etc.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, examples, or relevant information here.
      placeholder: Any additional information that might help us answer your question.
    validations:
      required: false

  - type: dropdown
    attributes:
      label: Tip
      description: This element is static, used to render a helpful sub-heading for end-users and community members to help prioritize issues. Please leave as is.
      options:
        - <sub>[React](https://github.blog/news-insights/product-news/add-reactions-to-pull-requests-issues-and-comments/) with 👍 to help prioritize this issue. Please use comments to provide useful context, avoiding `+1` or `me too`, to help us triage it. Learn more [here](https://opentelemetry.io/community/end-user/issue-participation/).</sub>
      default: 0